<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>パスキーもどき</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <h1>パスキーもどき v0.5</h1>
  <p class="note">デモです。パスキーの操作はしますが、サーバー側の検証も認可も一切ありません。</p>
  <p>
    パスキー認証: <button onclick="authenticate()">認証</button>
  </p>
  <p>
    パスキー登録: <input type="text" id="name" placeholder="パスキー名">
    <button onclick="register()">登録</button>
  </p>

  <script>
    // パスキー認証
    async function authenticate() {
      try {
        const assertion = await navigator.credentials.get({
          publicKey: {
            challenge: new Uint8Array([0]),
          }
        });
        alert("認証成功: " + assertion.id);
      } catch (e) {
        alert('認証エラー: ' + e);
      }
    }

    // 登録
    async function register() {
      const name = document.getElementById('name').value;
      try {
        const credential = await navigator.credentials.create({
          publicKey: {
            challenge: new Uint8Array([0]),
            rp: {
              name: "fake-passkey",
            },
            user: {
              id: new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(name))),
              name: name,
              displayName: name
            },
            pubKeyCredParams: [],
            authenticatorSelection: {
              residentKey: "preferred"
            }
          }
        });
        alert('登録成功: ' + credential.id);
      } catch (e) {
        alert('登録失敗: ' + e);
      }
    }
  </script>
</body>

</html>
